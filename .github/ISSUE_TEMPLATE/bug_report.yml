name: Bug report
description: Report something that is not working as expected
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        ADS-B data is public by design — please do not redact hex/callsign/squawk values.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `--version`, or the release tag / commit SHA
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: decoder
    attributes:
      label: Decoder
      options:
        - dump1090-fa
        - readsb
        - dump1090-mutability
        - tar1090 / aggregated feed
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command / configuration used
      description: The exact command line or config file
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include full error output / stack trace / logs
      render: text
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample data
      description: Relevant `aircraft.json` / `stats.json` excerpt, if applicable
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I tested with the latest release / `main`
          required: true
